name: Import allworld

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Copy allworld files onto main
        run: |
          git clone --depth=1 https://github.com/kromate/allworld.git /tmp/allworld
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/allworld/ ./
          git add -A
          git -c user.name="Benin-Life Import" -c user.email="benin-life-import@users.noreply.github.com" commit -m "Copy allworld source"
          git push origin main
